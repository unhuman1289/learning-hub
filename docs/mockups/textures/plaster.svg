<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!-- Very faint lime-plaster mottling for the room wall; works over light and dark wall colours. -->
  <filter id="mottle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="5" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.40  0 0 0 0 0.33  0.16 0 0 0 -0.05"/>
  </filter>
  <filter id="sand" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="9" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.31  0 0 0 0 0.26  0.3 0 0 0 -0.13"/>
  </filter>
  <rect width="320" height="320" filter="url(#mottle)"/>
  <rect width="320" height="320" filter="url(#sand)"/>
</svg>
