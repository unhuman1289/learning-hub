<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- Oak grain overlay: horizontally stretched noise, tinted brown, transparent between streaks. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0025 0.05" numOctaves="4" seed="7" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.17  0 0 0 0 0.09  0 0 0 0 0.03  1.25 0 0 0 -0.42"/>
  </filter>
  <filter id="pores" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.6" numOctaves="2" seed="3" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.14  0 0 0 0 0.08  0 0 0 0 0.03  0.9 0 0 0 -0.4"/>
  </filter>
  <rect width="480" height="480" filter="url(#grain)"/>
  <rect width="480" height="480" filter="url(#pores)" opacity="0.6"/>
</svg>
