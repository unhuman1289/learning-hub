    <g fill="#fff" stroke="#fff" stroke-width="2.6">
      <polygon points="0,0 7,-3 7,3"/>
      <rect x="7" y="-3" width="20" height="6"/>
      <rect x="27" y="-3.2" width="4" height="6.4"/>
      <rect x="31" y="-3" width="4.2" height="6" rx="1.6"/>
    </g>
    <g stroke="#2b2118" stroke-width="0.7">
      <polygon points="0,0 7,-3 7,3" fill="#e9cda6"/>
      <polygon points="0,0 2.7,-1.15 2.7,1.15" fill="#9b4268" stroke="none"/>
      <rect x="7" y="-3" width="20" height="6" fill="#d9a23c"/>
      <rect x="7" y="-1" width="20" height="2" fill="#efc05e" stroke="none"/>
      <rect x="27" y="-3.2" width="4" height="6.4" fill="#b9b8bd"/>
      <line x1="28.4" y1="-3.2" x2="28.4" y2="3.2"/>
      <line x1="29.7" y1="-3.2" x2="29.7" y2="3.2"/>
      <rect x="31" y="-3" width="4.2" height="6" rx="1.6" fill="#e7a3bf"/>
    </g>
    <circle cx="-1.5" cy="0" r="1.1" fill="#9b4268"/>
  </g>
</svg>
