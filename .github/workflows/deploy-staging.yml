name: Deploy Learning Hub staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: learning-hub-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Release and verify the staging commit
        run: |
          touch .staging-checkout
          npm run deploy:staging -- "$GITHUB_SHA" --apply-migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
