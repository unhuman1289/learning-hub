name: Deploy Learning Hub staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: learning-hub-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Apply pending staging D1 migrations
        run: npx wrangler d1 migrations apply learning-hub-staging --env staging --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy staging Worker
        run: npm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test staging over workers.dev
        run: node scripts/staging-smoke.mjs https://learning-hub-staging.tranvu-812.workers.dev
