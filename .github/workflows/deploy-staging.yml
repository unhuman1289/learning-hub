name: Deploy Learning Hub staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: learning-hub-staging
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/codex/hub-next-wip'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Release and verify the staging commit
        run: |
          deadline=$(sed -nE 's/^staging: .+, đến ([0-9]{2}:[0-9]{2}) Europe\/Berlin$/\1/p' docs/plan/HUB-NEXT-STATUS.md)
          if [[ -z "$deadline" || "$(TZ=Europe/Berlin date +%H:%M)" > "$deadline" || "$(TZ=Europe/Berlin date +%H:%M)" == "$deadline" ]]; then
            echo "Record an active staging reservation in HUB-NEXT-STATUS.md before deploying."
            exit 1
          fi
          touch .staging-checkout
          npm run deploy:staging -- "$GITHUB_SHA" --apply-migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Measure authenticated today timing
        run: node scripts/staging-timing.mjs
        env:
          STAGING_HOUSEHOLD_PASSPHRASE: ${{ secrets.STAGING_HOUSEHOLD_PASSPHRASE }}
          STAGING_TIMING_PROFILE_ID: ${{ secrets.STAGING_TIMING_PROFILE_ID }}
