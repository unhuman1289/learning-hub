name: Worker and D1 staging spike
on:
  push:
    branches:
      - codex/worker-d1-staging-spike
permissions:
  contents: read
concurrency:
  group: learning-hub-staging-spike
  cancel-in-progress: false
jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
      WRANGLER_LOG_PATH: .wrangler/logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate code, build, and staging deploy configuration
        run: |
          npm run test
          npm run typecheck
          npm run lint
          npm run build
          npm run deploy:staging -- --dry-run
      - name: Check Cloudflare credentials are configured
        run: test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Create or reuse staging and production D1 databases
        run: node scripts/provision-cloudflare-d1.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Apply baseline migrations to staging D1
        run: node_modules/.bin/wrangler d1 migrations apply learning-hub-staging --remote --env staging --config wrangler.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Build and deploy staging Worker
        run: |
          set -o pipefail
          npm run deploy:staging 2>&1 | tee "$RUNNER_TEMP/staging-deploy.log"
          staging_url="$(grep -Eo 'https://[[:alnum:].-]+\.workers\.dev' "$RUNNER_TEMP/staging-deploy.log" | tail -n 1)"
          test -n "$staging_url"
          echo "STAGING_URL=$staging_url" >> "$GITHUB_ENV"
          echo "Staging Worker: $staging_url"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke test page, health, and staging-only API boundary
        run: node scripts/staging-smoke.mjs "$STAGING_URL"
