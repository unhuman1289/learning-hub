name: Learning Hub CI
on:
  # One run per change: PRs run on pull_request; only the integration and main branches run on push.
  push:
    branches: [main, codex/hub-next-wip]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      e2e_diag:
        description: Capture E2E diagnostics
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run test
      - run: npm run contracts:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: 'false'
      E2E_DIAG: ${{ inputs.e2e_diag && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Test the built Worker
        run: node scripts/e2e-diagnostics.mjs u5 npm run test:e2e:u5
      - name: Test offline desk and profile changes
        run: node scripts/e2e-diagnostics.mjs f2 npm run test:e2e:u5
        env:
          F2_E2E: '1'
      - name: Test listening on both phones
        run: node scripts/e2e-diagnostics.mjs listening npm run test:e2e:listening
      - name: Test tutor on both phones
        run: node scripts/e2e-diagnostics.mjs tutor npm run test:e2e -- --config playwright.tutor.config.mjs
      - name: Test tutor sprite states on both phones
        run: node scripts/e2e-diagnostics.mjs t3 npm run test:e2e -- --config playwright.t3.config.mjs
      - name: Test whole-lesson tutor on both phones
        run: node scripts/e2e-diagnostics.mjs t5 npm run test:e2e -- --config playwright.t5.config.mjs
      - name: Upload E2E diagnostics
        if: always() && env.E2E_DIAG == '1'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            private-data/e2e-diagnostics/
            private-data/playwright/
          if-no-files-found: warn
          retention-days: 7
