name: Learning Hub CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run test
      - run: npm run contracts:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Test the built Worker
        run: npm run test:e2e:u5
      - name: Test listening on both phones
        run: npm run test:e2e:listening
      - name: Test tutor on both phones
        run: npm run test:e2e -- --config playwright.tutor.config.mjs
